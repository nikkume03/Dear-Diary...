<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dear Diary</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
</head>

<body>
    <div class="diary">
<!-- LEFT SIDE -->
        <aside class="sidebar">
            <div class="flower" id="flower1">🌸</div>
            <div class="flower" id="flower2">🌷</div>

            <h1>My Little Diary</h1>

            <p>
                A tiny corner of the internet
                where my thoughts can stay.
            </p>

            <div class="moon">🌙</div>

            <div class="quote">
                "Some days are memories.
                while some...become stories."
            </div>
        </aside>


<!-- MAIN -->
        <main class="content">
            <div class="top">
                <h2>Dear Diary...</h2>

                <div class="date">
                    <input type="text" placeholder="00">
                    <input type="text" placeholder="mon.">
                    <input type="text" placeholder="2026">
                </div>
            </div>


<!-- MOOD -->
            <div class="mood-title">
                How am I feeling today?
            </div>

            <div class="moods">
                <div class="mood">Happy :)</div>
                <div class="mood">Calm ))</div>
                <div class="mood">Tired :(</div>
                <div class="mood">Excited !!</div>
            </div>


<!-- Diary Entry -->
            <section class="paper">

                <h3>Today's thoughts...</h3>

                <textarea
                    placeholder="Dear Diary,
Dump all the thougts from your little head here..."
                ></textarea>
            </section>


            <!-- BOTTOM -->
            <div class="bottom">

                <div class="signature">
                    — See ya...♡
                </div>

                <button class="save">
                    Keep this memory ✨
                </button>
            </div>
        </main>
    </div>

</body>
</html>
